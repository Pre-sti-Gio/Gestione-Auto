<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Famiglia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Gestione Famiglia</h1>
            <nav class="main-nav">
                <button id="nav-macchina" class="nav-btn active">Macchina</button>
                <button id="nav-spesa" class="nav-btn">Spesa</button>
            </nav>
        </header>

        <main>
            <!-- SEZIONE MACCHINA -->
            <section id="sec-macchina" class="app-section active">
                <div class="tabs">
                    <button class="tab-btn active" data-target="tab-prenotazione">Prenotazione</button>
                    <button class="tab-btn" data-target="tab-registro">Registro</button>
                    <button class="tab-btn" data-target="tab-rifornimento">Rifornimento</button>
                    <button class="tab-btn" data-target="tab-dashboard">Dashboard</button>
                </div>

                <!-- Prenotazione -->
                <div id="tab-prenotazione" class="tab-content active glass-card">
                    <h2>Prenota la Macchina</h2>
                    <form id="form-prenotazione">
                        <div class="form-group">
                            <label>Chi prenota?</label>
                            <select id="prenotazione-utente" required>
                                <option value="" disabled selected>Seleziona persona...</option>
                                <option value="Mamma">Mamma</option>
                                <option value="Papà">Papà</option>
                                <option value="Mary">Mary</option>
                                <option value="Gio">Gio</option>
                                <option value="Betty">Betty</option>
                            </select>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Data Inizio</label>
                                <input type="date" id="prenotazione-data-inizio" required>
                            </div>
                            <div class="form-group">
                                <label>Data Fine</label>
                                <input type="date" id="prenotazione-data-fine" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Ora Inizio</label>
                                <input type="time" id="prenotazione-inizio" step="300" required>
                            </div>
                            <div class="form-group">
                                <label>Ora Fine</label>
                                <input type="time" id="prenotazione-fine" step="300" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Km previsti</label>
                                <input type="number" id="prenotazione-km" placeholder="Es. 15" required min="1">
                            </div>
                            <div class="form-group">
                                <label>Motivo</label>
                                <input type="text" id="prenotazione-motivo" placeholder="Es. Spesa, Lavoro..." required>
                            </div>
                        </div>
                        <button type="submit" class="primary-btn">Conferma Prenotazione</button>
                    </form>
                </div>

                <!-- Registro -->
                <div id="tab-registro" class="tab-content glass-card">
                    <h2>Registro Prenotazioni</h2>
                    <ul id="lista-registro" class="list-container"></ul>
                </div>

                <!-- Rifornimento -->
                <div id="tab-rifornimento" class="tab-content glass-card">
                    <h2>Inserisci Rifornimento</h2>
                    <form id="form-rifornimento">
                        <div class="form-group">
                            <label>Chi ha fatto benzina?</label>
                            <select id="rifornimento-utente" required>
                                <option value="" disabled selected>Seleziona persona...</option>
                                <option value="Mamma">Mamma</option>
                                <option value="Papà">Papà</option>
                                <option value="Mary">Mary</option>
                                <option value="Gio">Gio</option>
                                <option value="Betty">Betty</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Data</label>
                            <input type="date" id="rifornimento-data" required>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Importo (€)</label>
                                <input type="number" step="0.01" id="rifornimento-importo" placeholder="Es. 50.00" required>
                            </div>
                            <div class="form-group">
                                <label>Costo al Litro (€/l)</label>
                                <input type="number" step="0.001" id="rifornimento-costo" placeholder="Es. 1.859" required>
                            </div>
                        </div>
                        <button type="submit" class="primary-btn">Aggiungi Rifornimento</button>
                    </form>
                </div>

                <!-- Dashboard -->
                <div id="tab-dashboard" class="tab-content glass-card">
                    <h2>Dashboard</h2>
                    <div class="form-row" style="margin-bottom: 1.5rem;">
                        <div class="form-group" style="background: rgba(0,0,0,0.2); padding: 1rem; border-radius: 12px; text-align: center;">
                            <h3 style="font-size: 0.9rem; color: #cbd5e1; margin-bottom: 0.5rem;">Chilometri Previsti</h3>
                            <p id="stat-km" style="font-size: 1.8rem; font-weight: 700; color: #3b82f6;">0</p>
                        </div>
                        <div class="form-group" style="background: rgba(0,0,0,0.2); padding: 1rem; border-radius: 12px; text-align: center;">
                            <h3 style="font-size: 0.9rem; color: #cbd5e1; margin-bottom: 0.5rem;">Spesa Totale</h3>
                            <p id="stat-fuel" style="font-size: 1.8rem; font-weight: 700; color: #ef4444;">0 €</p>
                        </div>
                        <div class="form-group" style="background: rgba(0,0,0,0.2); padding: 1rem; border-radius: 12px; text-align: center;">
                            <h3 style="font-size: 0.9rem; color: #cbd5e1; margin-bottom: 0.5rem;">Litri Totali</h3>
                            <p id="stat-litri" style="font-size: 1.8rem; font-weight: 700; color: #10b981;">0 L</p>
                        </div>
                    </div>
                    <div class="charts-container">
                        <div class="chart-box">
                            <canvas id="chart-km"></canvas>
                        </div>
                        <div class="chart-box">
                            <canvas id="chart-spese"></canvas>
                        </div>
                        <div class="chart-box">
                            <canvas id="chart-litri"></canvas>
                        </div>
                        <div class="chart-box full-width">
                            <canvas id="chart-prenotazioni"></canvas>
                        </div>
                    </div>
                </div>
            </section>

            <!-- SEZIONE SPESA -->
            <section id="sec-spesa" class="app-section">
                <div class="glass-card">
                    <h2>Lista della Spesa</h2>
                    <form id="form-spesa" class="add-spesa-form" style="flex-wrap: wrap;">
                        <select id="spesa-utente" required style="flex: 1; min-width: 150px;">
                            <option value="" disabled selected>Chi sei?</option>
                            <option value="Mamma">Mamma</option>
                            <option value="Papà">Papà</option>
                            <option value="Mary">Mary</option>
                            <option value="Gio">Gio</option>
                            <option value="Betty">Betty</option>
                        </select>
                        <input type="text" id="spesa-prodotto" placeholder="Cosa dobbiamo comprare?" required style="flex: 2; min-width: 200px;">
                        <button type="submit" class="primary-btn">Aggiungi</button>
                    </form>
                    <ul id="lista-spesa" class="list-container"></ul>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
